<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rover — Autonomous Planetary Rover</title>
  </head>
  <body>
    <header id="topbar">
      <div class="brand">ROVER<span>/ASM</span></div>
      <div class="group" id="speed">
        <button data-speed="0" title="Pause (Space)">❚❚</button>
        <button data-speed="1">1×</button>
        <button data-speed="5">5×</button>
        <button data-speed="20">20×</button>
      </div>
      <div class="group">
        <button id="btn-step" title="Execute one instruction (.)">Step instr</button>
        <button id="btn-tick" title="Advance one tick">Step tick</button>
      </div>
      <label class="group small">Tick rate <input id="tick-hz" type="number" min="1" max="60" value="10" /> Hz</label>
      <div class="spacer"></div>
      <div class="group small" id="credits" title="Science credits: delivered science + goal rewards"></div>
      <div class="group small" id="clock"></div>
      <div class="group">
        <button id="btn-view" title="Toggle camera (V)">View</button>
        <button id="btn-follow" title="Follow rover (F)">Follow</button>
        <button id="btn-new" title="Start a new world with a random seed">New world</button>
      </div>
    </header>
    <main>
      <section id="viewport">
        <div id="hud"></div>
        <canvas id="compass" title="Sky compass: sun (yellow), relay orbiter (cyan triangle), solar array (blue), dish (dashed)"></canvas>
        <div id="hover"></div>
        <div id="toasts"></div>
      </section>
      <aside id="side">
        <div class="tabs">
          <button class="tab active" data-tab="code">Code</button>
          <button class="tab" data-tab="goals">Goals</button>
          <button class="tab" data-tab="ref">Reference</button>
          <button class="tab" data-tab="admin">Admin</button>
        </div>
        <div class="tabpane active" id="tab-code">
          <div class="toolbar">
            <button id="btn-upload" class="primary" title="Ctrl+Enter">Upload &amp; reboot</button>
            <button id="btn-revert" title="Load the firmware currently on the rover">Revert</button>
            <select id="template" title="Load a firmware template into the editor"><option value="">Templates…</option></select>
            <span id="flash" class="small"></span>
          </div>
          <div class="toolbar small dim">
            <span id="upload-cost"></span>
          </div>
          <div id="editor"></div>
          <div id="debugger"></div>
        </div>
        <div class="tabpane" id="tab-goals"><div id="goals"></div></div>
        <div class="tabpane" id="tab-ref"><div id="reference"></div></div>
        <div class="tabpane" id="tab-admin">
          <p class="small dim">Cheats for when your rover is stuck. They do not touch the program.</p>
          <div class="toolbar">
            <button id="adm-charge">Force charge</button>
            <button id="adm-repair">Force repair</button>
            <button id="adm-respawn">Respawn at origin</button>
          </div>
          <label class="small"><input type="checkbox" id="adm-free" /> Free uploads (ignore signal &amp; battery cost)</label>
          <label class="small"><input type="checkbox" id="adm-reveal" /> Reveal map (disable fog of war)</label>
          <p class="small dim" id="world-info"></p>
        </div>
        <div id="log"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
