<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rover — M8 asset preview</title>
    <style>
      :root { --cyan: #38bdf8; --panel: rgba(10, 20, 32, 0.88); --line: rgba(56, 189, 248, 0.28); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #050910; color: #e2e8f0; font: 12px/1.4 ui-monospace, 'JetBrains Mono', Menlo, monospace; }
      #view { position: absolute; inset: 0; }
      #view canvas { display: block; width: 100%; height: 100%; cursor: grab; }
      .crt::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%); background-size: 100% 4px; }
      .crt::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
      .panel { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; backdrop-filter: blur(6px); }
      #title { top: 10px; left: 10px; }
      #title b { color: var(--cyan); letter-spacing: 2px; }
      #title .dim { color: #7d8ca3; }
      #controls { bottom: 10px; left: 10px; right: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
      #controls button, #controls label { background: rgba(15, 30, 48, 0.85); border: 1px solid rgba(56, 189, 248, 0.35); color: #cbd5e1; border-radius: 6px; padding: 6px 8px; font: inherit; cursor: pointer; text-align: left; }
      #controls button.on { background: rgba(56, 189, 248, 0.18); border-color: var(--cyan); color: var(--cyan); }
      #controls label { display: flex; flex-direction: column; gap: 3px; cursor: default; }
      #controls input[type=range] { width: 100%; }
      #controls .tag { font-size: 10px; color: #7dd3fc; }
      #stats { top: 10px; right: 10px; white-space: pre; color: #7d8ca3; }
      #labels { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
      #labels div { position: absolute; transform: translate(-50%, -100%); font-size: 10px; color: #cbd5e1; background: rgba(5, 9, 16, 0.7); border: 1px solid rgba(56, 189, 248, 0.25); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
      #photolab { position: absolute; inset: 0; z-index: 20; overflow: auto; background: #050910; padding: 14px; }
      #photolab[hidden] { display: none; }
      .pl-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
      .pl-head b { color: var(--cyan); letter-spacing: 2px; }
      .pl-head .dim, #photolab .dim { color: #7d8ca3; }
      .pl-toggles { display: flex; gap: 6px; }
      .pl-toggles button { background: rgba(15, 30, 48, 0.85); border: 1px solid rgba(56, 189, 248, 0.35); color: #cbd5e1; border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
      .pl-toggles button.on { background: rgba(56, 189, 248, 0.18); border-color: var(--cyan); color: var(--cyan); }
      .pl-grid { display: grid; grid-template-columns: 120px repeat(6, 140px) 160px; gap: 10px 12px; align-items: start; }
      .pl-colhead { color: #7dd3fc; font-size: 11px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
      .pl-name { padding-top: 4px; }
      .pl-cell canvas { display: block; border: 1px solid var(--line); border-radius: 3px; }
      .pl-cell pre { margin: 3px 0 0; font-size: 9.5px; line-height: 1.25; color: #9fb3c8; }
      .ui-lab { display: flex; gap: 16px; align-items: stretch; height: calc(100vh - 150px); }
      .ui-side { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; background: #0b0f17; }
      .ui-side .tabpane { overflow: hidden; }
      .ui-log { height: 70px; overflow: auto; color: #7d8ca3; margin: 8px 0 0; font-size: 11px; }
      .pl-na { height: 112px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); }
    </style>
  </head>
  <body>
    <div id="view" class="crt"></div>
    <div id="labels"></div>
    <div class="panel" id="title">
      <b>ROVER / M8 ASSET PREVIEW</b><br />
      <span class="dim">Left-drag pan · right/Ctrl-drag orbit · wheel zoom to cursor · Q/E rotate · T top view</span>
    </div>
    <div class="panel" id="stats"></div>
    <div class="panel" id="controls"></div>
    <div id="photolab" hidden></div>
    <script type="module" src="/src/preview/preview.ts"></script>
  </body>
</html>
